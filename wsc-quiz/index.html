<title>WSC 2026 Scholar's Challenge – Set H (Junior)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7385;--line:#dfe3ea;--acc:#3757d6;--accbg:#e8edff;--ok:#1f8a4c;--okbg:#e2f5ea;--bad:#c2372f;--badbg:#fdeaea;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141821;--card:#1d2330;--fg:#e8ebf2;--mut:#98a1b5;--line:#2e3647;--acc:#7d97ff;--accbg:#26305a;--ok:#4cc580;--okbg:#17342a;--bad:#ff7a70;--badbg:#3b1f22;--warn:#e3b04b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141821;--card:#1d2330;--fg:#e8ebf2;--mut:#98a1b5;--line:#2e3647;--acc:#7d97ff;--accbg:#26305a;--ok:#4cc580;--okbg:#17342a;--bad:#ff7a70;--badbg:#3b1f22;--warn:#e3b04b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font-size:15px;margin:0;flex:1}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
#timer.low{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.layout{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.qnum{color:var(--mut);font-size:14px;margin-bottom:6px}
.qtext{font-size:19px;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.opt:hover{border-color:var(--acc)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .l{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.struck{opacity:.55;text-decoration:line-through}
.hint{font-size:13px;color:var(--mut);margin:0 0 14px}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.nav .sp{flex:1}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:12px;padding:0}
#grid button.ans{background:var(--accbg);border-color:var(--acc)}
#grid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
#grid button.cur{outline:2px solid var(--fg)}
#grid button.ok{background:var(--okbg);border-color:var(--ok)}
#grid button.bad{background:var(--badbg);border-color:var(--bad)}
.side .stat{font-size:13px;color:var(--mut);margin:10px 0}
.center{text-align:center}
.big{font-size:44px;font-weight:800;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.fb{margin-top:10px;font-size:14px;padding:8px 12px;border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:20}
#modal .card{max-width:420px;width:100%}
#modal .row{justify-content:flex-end}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
</style>
</head>

<script>
const Q = [{"n": 1, "q": "Which index would best expose a country whose GDP is rising while its poorest households gain nothing?", "o": ["Big Mac Index", "Gross National Income", "Passport Index", "Labor Productivity", "Gini Coefficient"], "a": 4}, {"n": 2, "q": "What does a skeleton screen put on the page while content loads?", "o": ["The program's logo and its version number", "Lines of text reporting each step", "A percentage counting up to completion", "Grey placeholder boxes in the page's layout", "A spinning icon of unchanging size"], "a": 3}, {"n": 3, "q": "Brad Myers's 1985 result about progress bars is best described as:", "o": ["Reassuring even when inaccurate", "Accurate but widely disliked", "Useful only to programmers", "Faster than every alternative", "Harmful to task completion"], "a": 0}, {"n": 4, "q": "An elevator close-door button wired to nothing and Wizard of Oz testing share which property?", "o": ["Both replace a human operator with working software", "Both were introduced to cut a building's running costs and its staffing", "Both were abandoned once users complained about them", "The user credits a mechanism that is not doing the work", "Both ask the user to consent before they begin"], "a": 3}, {"n": 5, "q": "Houston airport's lengthened walk to baggage claim and the design of a doctor's waiting room share which aim?", "o": ["Reducing the number of staff on shift", "Making the true remaining wait time visible", "Filling the wait rather than shortening it", "Charging the visitor a fee for the delay", "Moving the queue somewhere out of public view"], "a": 2}, {"n": 6, "q": "The Passport Index and the voyage of the MS St. Louis both turn on which fact?", "o": ["Wealthy countries issue the most visas on arrival", "Border officials favour applicants who speak the language", "A ship may dock wherever its flag of registry permits", "Admission is decided by the document, not the traveller", "Sea travel costs refugees less than air travel does"], "a": 3}, {"n": 7, "q": "Frida Kahlo's The Bus and the Gini Coefficient both do which of these?", "o": ["Measure a household's access to clean drinking water", "Compare one identical purchase across two currencies", "Record how far a population travels to reach work", "Hold a society's whole income range in one view", "Rank countries against one another by total wealth"], "a": 3}, {"n": 8, "q": "Why did the fast-to-slow progress indicator produce the lowest abandonment rate?", "o": ["It awarded users points once they finished", "It matched the true processing speed", "Early progress beat what users expected", "It finished the survey in less time", "It concealed how many questions remained"], "a": 2}, {"n": 9, "q": "The throbber differs from the percentage progress bar in much the same way that:", "o": ["a rough draft differs from a copy sent to the printer", "a ladder differs from a staircase", "a whisper differs from a shout", "an indeterminate sentence differs from a fixed term", "a map differs from a photograph"], "a": 3}, {"n": 10, "q": "Which of these would Brad Myers most likely defend?", "o": ["A survey that hides how long it will take", "A console log shown only to the developers", "A splash screen that conceals the whole wait", "A loading screen carrying no indicator at all", "A progress bar that does not track real progress"], "a": 4}, {"n": 11, "q": "Which of these is LEAST likely to be a placebo button in the curriculum's examples?", "o": ["A pedestrian crossing button", "A crosswalk button in Austin, Texas", "An office wall thermostat", "A vending machine's selection button", "An elevator's close-door button"], "a": 3}, {"n": 12, "q": "Oliver Burkeman's done list and the progress bar share which feature?", "o": ["Both report what is finished, not what remains", "Both cap how many items may be open at once", "Both were designed to be read by a manager", "Both set a deadline the user has to meet", "Both rank the remaining tasks by urgency"], "a": 0}, {"n": 13, "q": "A supporter of the message of Sinatra's \"My Way\" would most likely value:", "o": ["debts repaid before the end", "a reputation defended in public", "a fortune left to one's children", "choices made on one's own terms", "a faith held to without any doubt"], "a": 3}, {"n": 14, "q": "Which of these would the Fifth Monarchy Men most likely have expected?", "o": ["A reduction in the hours of manual labour", "The abolition of all religious observance", "A new college for experimental science", "The restoration of the Stuart monarchy", "The kingdom of Jesus established on earth"], "a": 4}, {"n": 15, "q": "Why did 1666 in particular read as apocalyptic to Londoners?", "o": ["A comet had been visible for three months", "A solar eclipse crossed England that year", "The year's final three digits were 666", "Half the city's population had died", "The Thames had flooded the lower city"], "a": 2}, {"n": 16, "q": "The Millerites and Francis Fukuyama's End of History are alike in which respect?", "o": ["A declared ending was reinterpreted rather than abandoned", "Both set their date by reading the Book of Daniel", "Both predicted the collapse of a named empire", "Both were retracted by their authors within a decade", "Both were funded by a national government"], "a": 0}, {"n": 17, "q": "Which change did Van Gogh make in the smallest of the three Bedroom in Arles canvases?", "o": ["Lighter colours and more delicate brushwork", "The addition of a figure seated on the chair", "A switch to a single-point perspective scheme", "The removal of the bed from the room", "A shift from oil paint to watercolour"], "a": 0}, {"n": 18, "q": "\"In the Bedroom Down the Hall\" was cut from Dear Evan Hansen for a reason the Iron Triangle would describe as:", "o": ["Time extended because the budget allowed it", "Scope surrendered to protect the schedule", "Cost increased in order to protect quality", "Quality surrendered in order to reduce cost", "Scope widened after the deadline moved"], "a": 1}, {"n": 19, "q": "The Beatles' home demo of \"Strawberry Fields Forever\" is valued for the same reason a low-fidelity prototype is:", "o": ["It exposes the structure the finished version covers", "It records the reaction of a test audience", "It was made by a larger group of contributors", "It was released to the public before the final", "It costs less to reproduce and distribute"], "a": 0}, {"n": 20, "q": "What does Illich's Law state about hours worked?", "o": ["Output rises in proportion to the hours invested", "A fifth of the hours produce most of the result", "The last tenth of the work takes half the total time", "Past a threshold, productivity falls and then turns negative", "Adding workers to work already running late delays it further"], "a": 3}, {"n": 21, "q": "The Hawthorne Effect and Laurence Steinberg's driving simulation both show that being watched changes behaviour, but they differ because Steinberg's subjects:", "o": ["were studied over a period of several years", "had been selected for their existing skill", "showed the same behaviour either way", "took more risks rather than working harder", "were observed without being told about it"], "a": 3}, {"n": 22, "q": "The 1671 London ordinance that followed the Great Fire required which of these?", "o": ["Fire breaks between adjoining terraces", "Brick facades on every new building", "A minimum width for all city streets", "Elevated walkways of Purbeck stone", "Cobblestone walkways and protective bollards"], "a": 4}, {"n": 23, "q": "Which of these would Frank Lloyd Wright most likely have approved?", "o": ["A garage protruding ahead of the front door", "A roofed carport forming part of the house", "A separate stable built behind the house", "A multi-storey lot at the end of the street", "Kerbside parking along a residential road"], "a": 1}, {"n": 24, "q": "Moving sidewalks and desire paths both demonstrate which point about routes?", "o": ["Public transport carries more people per lane than private cars", "People choose their own direction, so a fixed one is ignored", "Paved surfaces last longer than unpaved ones", "Shorter routes always attract heavier traffic", "Pedestrians will pay for a faster crossing"], "a": 1}, {"n": 25, "q": "What distinguishes a proof of concept from a minimum viable product?", "o": ["It is always a physical rather than digital object", "It is shown to investors but never to users", "It is built by engineers rather than designers", "It contains every feature the final product will have", "It shows the idea is possible, not that it sells"], "a": 4}, {"n": 26, "q": "Fusion power occupies the same position in this year's curriculum that a proof of concept occupies in the prototyping cycle, because both:", "o": ["were abandoned after a single failed trial", "were financed by venture capital", "have shown the principle without a working product", "require a patent before work can continue", "are tested on a sample of users before anything is built"], "a": 2}, {"n": 27, "q": "Why did Amazon's Just Walk Out stores need around 700 human reviews per 1,000 sales?", "o": ["The cameras failed in low-light conditions", "Local law required a cashier to be present", "The stores had no way to accept card payments", "Customers repeatedly refused to use the system", "The machine learning model still needed labelled data"], "a": 4}, {"n": 28, "q": "What did Brian Eno say Ambient 1: Music for Airports was meant to carry?", "o": ["A melody the traveller would remember later", "A connection to death rather than cheerfulness", "A rhythm matched to a walking pace", "A recording of the terminal's own noise", "A warning that a departure was imminent"], "a": 1}, {"n": 29, "q": "Monet's Gare Saint-Lazare in this year's curriculum is best described as:", "o": ["Unfinished by comparison with its companions", "Photographic in its architectural detail", "Symmetrical about the bridge at its centre", "Empty of any figure on the platform", "Painted entirely in a single sitting"], "a": 0}, {"n": 30, "q": "Which rite of passage in this year's curriculum is triggered by an achievement rather than an age?", "o": ["Khatam al-Quran", "Fiesta de Quinceanera", "Sweet sixteen", "Seijin no Hi", "Guan Li"], "a": 0}, {"n": 31, "q": "Which of these would the speaker of Gwendolyn Brooks's \"We Real Cool\" most likely accept?", "o": ["That their parents were right after all", "That the pool hall should be shut down", "That the path they are on ends early", "That work is better than idleness", "That school will be finished next year"], "a": 2}, {"n": 32, "q": "What did the Chinese south-pointing spoon originally serve?", "o": ["Timekeeping", "Mining for jade", "Sea navigation", "Land surveying", "Divination"], "a": 4}, {"n": 33, "q": "Why is the radical pair mechanism, rather than magnetite, the leading explanation for bird magnetoreception?", "o": ["Earth's field is too weak to act by any other route", "Birds navigate only during the daytime", "Radio interference cannot affect magnetite", "Magnetite is found only in magnetotactic bacteria, never in birds", "Birds have no iron in their beaks"], "a": 0}, {"n": 34, "q": "Which reading of \"The Road Not Taken\" does the curriculum call the common misunderstanding?", "o": ["That it denies any choice was ever made", "That it recommends retracing the route later", "That it prefers the more familiar road", "That it celebrates choosing the unusual path", "That it warns against travelling at night"], "a": 3}, {"n": 35, "q": "Which of these is NOT among the longevity approaches listed in this year's curriculum?", "o": ["Senotherapeutics", "Bioprinting", "Telomere extension", "Cryonics", "Gene drives"], "a": 4}, {"n": 36, "q": "The five separate endings of The Return of the King function in much the same way that:", "o": ["a series of epilogues does in a long novel", "a footnote does in an academic paper", "an interval does in a stage play", "a sequel does after a successful release", "a trailer does in the minutes before a feature film"], "a": 0}, {"n": 37, "q": "In the Pentagon writing exercise, what did the one general who answered say she did after listing priorities?", "o": ["Delegated the lower half to her staff", "Ranked them again the following morning", "Set a separate deadline against each one", "Crossed out everything from three down", "Combined the smallest of them into one"], "a": 3}, {"n": 38, "q": "Which of these would Umberto Eco most likely classify as a poetic list?", "o": ["An inventory of a museum's holdings", "A shopping list for the week", "A restaurant's numbered menu", "Homer's catalogue of the Greek ships", "A register of a kingdom's rivers"], "a": 3}, {"n": 39, "q": "According to recent work on the Zeigarnik Effect, why does an unfinished task keep returning to mind?", "o": ["The reward for finishing was set too low", "The task was more difficult than expected", "The task was interrupted by another that mattered more", "The conscious mind has forgotten the deadline", "The unconscious is asking for a plan to be made"], "a": 4}, {"n": 40, "q": "Which event would Sandro Botticelli most likely have read as the sign behind The Mystical Nativity?", "o": ["A comet crossing the night sky", "The fall of Constantinople", "A French invasion of Italy", "The arrival of the Black Death", "The sack of Rome by imperial troops"], "a": 2}, {"n": 41, "q": "Durer's Four Horsemen is to the Book of Revelation as Schreckengost's Apocalypse '42 is to:", "o": ["the four plagues of ancient Egypt", "the leaders of the Axis powers", "the commanders of the Allied forces", "the first use of the atomic bomb", "the influenza pandemic of 1918"], "a": 1}, {"n": 42, "q": "Why can the money spent on the Y2K bug not be shown to have worked?", "o": ["The affected systems were replaced anyway", "Governments refused to release their figures", "The failure it was meant to stop never arrived", "The spending was never publicly recorded", "The bug was found to have been imaginary"], "a": 2}, {"n": 43, "q": "The global spending on the Y2K bug and a project's risk register share which awkward feature?", "o": ["Both assign a single owner to every threat", "Both are compiled only after the event occurs", "Both rank threats by the cost of fixing them", "Both were first introduced by national governments", "A prevented harm leaves no evidence it was prevented"], "a": 4}, {"n": 44, "q": "Weekly chlorophyll readings in a lake begin swinging more widely without trending up or down. Which idea applies?", "o": ["The multidimensional measurement of poverty", "The second law applied to a closed system", "Termination shock after a cooling programme", "A breached tipping point in a warm-water reef", "Rising variance as a precursor to collapse"], "a": 4}, {"n": 45, "q": "The figure of Death in Bruegel's The Triumph of Death is best described as:", "o": ["A hooded man with an hourglass", "A crowned king on a throne", "A skeleton riding a horse", "A winged serpent above a city", "An angel carrying a sword"], "a": 2}, {"n": 46, "q": "John Martin's The Great Day of His Wrath is most often read as condemning which of these?", "o": ["Scientific inquiry", "Foreign conquest", "The industrial city", "Naval warfare", "Religious tolerance"], "a": 2}, {"n": 47, "q": "Munch's Despair differs from The Scream in much the same way that:", "o": ["a printed edition differs from a single unique original", "a commission differs from a private work", "a sketch differs from a finished oil", "a named individual differs from an anonymous figure", "a portrait differs from a landscape"], "a": 3}, {"n": 48, "q": "Matisse's Dance (II) differs from Dance (I) chiefly in being:", "o": ["Composed of six rather than five figures", "More saturated and more muscular", "Smaller and more delicately painted", "Set against an interior wall", "Painted from a photograph"], "a": 1}, {"n": 49, "q": "Which element were the writers of \"Golden\" required to include?", "o": ["A reference to the film's director", "A key change in the final chorus", "The three members' backstories", "A spoken introduction in English", "A repeated four-note guitar figure"], "a": 2}, {"n": 50, "q": "Why was \"Count on Me\" replaced in Aladdin?", "o": ["It was too expensive to stage", "It failed to establish Aladdin as street-smart", "It repeated a melody used elsewhere", "Its lyricist had left the production", "It gave Jasmine too little of the melody to sing"], "a": 1}, {"n": 51, "q": "Which line did Lin-Manuel Miranda carry from \"This One's Mine\" into the finished number?", "o": ["\"This one's mine\"", "\"I am helpless\"", "\"Down for the count\"", "\"Look into your eyes\"", "\"My name is Eliza\""], "a": 0}, {"n": 52, "q": "A student repeats a list aloud without connecting it to anything they already know. Which kind of rehearsal is this?", "o": ["Conversational rehearsal", "Cumulative rehearsal", "Maintenance rehearsal", "Elaborative rehearsal", "Attentional refreshing"], "a": 2}, {"n": 53, "q": "How does the demo of \"Dead Mom\" differ from the Broadway version?", "o": ["It omits any reference to her mother", "It is in a higher key with a longer bridge", "It was written by a different composer and lyricist", "It has no instrumental accompaniment", "It is sung by a male performer"], "a": 1}, {"n": 54, "q": "Brooks' Law is to a late software project as Braess's Paradox is to:", "o": ["an inflating currency", "a congested road network", "a rising national debt", "an overheated reactor", "a collapsing fish stock"], "a": 1}, {"n": 55, "q": "Conway's Law describes a relationship that is best characterised as:", "o": ["Contradiction", "Causation", "Coincidence", "Correspondence", "Compensation"], "a": 3}, {"n": 56, "q": "Which of these would Douglas Hofstadter's law predict?", "o": ["A revised estimate will still be too short", "A project will finish under its budget", "The last tenth will take the least time", "A delay will shorten the following stage", "A team will shrink as the deadlin const N = Q.length, LET = 'ABCDE', KEY = 'wscH_v1';

const $ = s => document.querySelector(s);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
function ask(msg, yes, ok, cancel) {
  $('#mmsg').textContent = msg; $('#myes').textContent = ok || 'OK';
  $('#mno').hidden = cancel === false; $('#modal').hidden = false;

}
const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

function points(i) {
  const s = S.sel[i] || [];
  return s.length && s.includes(Q[i].a) ? 1 / s.length : 0;
}
function total() { let t = 0; for (let i = 0; i < N; i++) t += points(i); return t; }
const remaining = () => S.dur ? S.dur - S.elapsed : null;

function home() {

  $('#timer').classList.add('hide'); $('#hsubmit').hidden = true;
  const old = load();
  $('#app').innerHTML = `<div class="card">
    <h2 style="margin-top:0">Practice Set H — Junior Division</h2>
    <p>120 questions · five options, one correct · 60 minutes.</p>
    <p><b>Certainty-factor scoring:</b> click more than one option to shade several. If the correct answer is among them you earn 1/n of a point (n = number shaded); otherwise 0. Click a shaded option again to unshade it.</p>
    <p><label>Mode: <select id="mode">
      <option value="exam">Exam – 60-minute timer, answers revealed at the end</option>

    <div class="row" style="justify-content:flex-start">
      <button class="btn pri" id="go">Start new attempt</button>
      ${old && !old.done ? '<button class="btn" id="resume">Resume attempt (' + Object.keys(old.sel).length + '/120 answered)</button>' : ''}

    </div></div>`;
  const begin = () => {
    const mode = $('#mode').value;
    S = {mode, dur: mode === 'exam' ? 3600 : 0, elapsed: 0, sel: {}, flag: {}, cur: 0, done: false, checked: {}};
    save(); start();
  };
  $('#go').onclick = () => old && !old.done ? ask('Discard the unfinished attempt and start over?', begin, 'Start over') : begin();
  if ($('#resume')) $('#resume').onclick = () => { S = old; start(); };
  if ($('#seeres')) $('#seeres').onclick = () => { S = old; results(); };
}

function start() {
  view = 'quiz';
  $('#hsubmit').hidden = false;
  const t = $('#timer');
  clearInterval(tick);
  if (S.dur) {
    t.classList.remove('hide');
    let last = Date.now();
    tick = setInterval(() => {
      if (document.hidden) { last = Date.now(); return; }   // pause while tab hidden
      const now = Date.now(); S.elapsed += (now - last) / 1000; last = now;
      const r = remaining();
      t.textContent = fmt(r); t.classList.toggle('low', r < 300);
      if (Math.round(S.elapsed) % 10 === 0) save();
      if (r <= 0) { S.timeUp = true; submit(true); }
    }, 500);
    t.textContent = fmt(remaining());
  } else t.classList.add('hide');
  draw();
}

function draw() {
  const i = S.cur, q = Q[i], sel = S.sel[i] || [], chk = S.mode === 'practice' && S.checked[i];
  const opts = q.o.map((o, k) => {
    let c = 'opt';
    if (chk) c += k === q.a ? ' ok' : sel.includes(k) ? ' bad' : '';
    else if (sel.includes(k)) c += ' sel';
    return `<button class="${c}" data-k="${k}"><span class="l">${LET[k]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const fb = chk ? `<div class="fb">${sel.length ? (sel.includes(q.a) ? '✔ Correct — ' + points(i).toFixed(2) + ' pt' : '✘ Incorrect — 0 pt') : 'Unanswered'}. Answer: <b>${LET[q.a]}</b></div>` : '';
  const answered = Object.keys(S.sel).filter(k => S.sel[k].length).length;
  $('#app').innerHTML = `<div class="layout">
    <section class="card">
      <div class="qnum">Question ${q.n} of ${N}${S.flag[i] ? ' · ⚑ flagged' : ''}</div>
      <p class="qtext">${esc(q.q)}</p>
      <p class="hint">Click to select. Select several to hedge (1/n point if correct is included).</p>
      ${opts}${fb}
      <div class="nav">
        <button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>← Prev</button>
        <button class="btn" id="flag">${S.flag[i] ? 'Unflag' : 'Flag'}</button>
        ${S.mode === 'practice' ? '<button class="btn" id="check">Check</button>' : ''}
        <span class="sp"></span>
        <button class="btn pri" id="next" ${i === N - 1 ? 'disabled' : ''}>Next →</button>
      </div>
    </section>
    <aside class="card side">
      <div id="grid"></div>
      <div class="stat">${answered} / ${N} answered · ${Object.keys(S.flag).filter(k => S.flag[k]).length} flagged</div>
    </aside></div>`;
  $('#grid').innerHTML = Q.map((_, k) => {
    let c = (S.sel[k] || []).length ? 'ans' : '';
    if (S.flag[k]) c += ' flag';
    if (k === i) c += ' cur';
    if (S.mode === 'practice' && S.checked[k]) c = (k === i ? 'cur ' : '') + (points(k) > 0 ? 'ok' : 'bad') + (S.flag[k] ? ' flag' : '');
    return `<button class="${c}" data-k="${k}">${k + 1}</button>`;
  }).join('');

}
function go(k) { S.cur = Math.min(N - 1, Math.max(0, k)); save(); draw(); window.scrollTo(0, 0); }
function pick(k) {
  if (S.mode === 'practice' && S.checked[S.cur]) return;
  const a = S.sel[S.cur] || [];
  S.sel[S.cur] = a.includes(k) ? a.filter(x => x !== k) : [...a, k].sort();
  save(); draw();
}

function finish() { S.done = true; clearInterval(tick); save(); results(); }
function submit(force) {
  if (force) return finish();
  const un = N - Object.keys(S.sel).filter(k => S.sel[k].length).length;
  ask(un ? un + ' question(s) unanswered. Submit anyway?' : 'Submit your answers?', finish, 'Submit');
}

function results() {
  clearInterval(tick);
  $('#timer').classList.add('hide'); $('#hsubmit').hidden = true;
  let right = 0, wrong = 0, blank = 0, hedged = 0;
  for (let i = 0; i < N; i++) {
    const s = S.sel[i] || [];
    if (!s.length) blank++; else if (s.includes(Q[i].a)) right++; else wrong++;
    if (s.length > 1) hedged++;
  }
  const sc = total();
  $('#app').innerHTML = `<div class="card center">
    <div class="qnum">${S.timeUp ? "Time's up · " : ''}Your score</div>
    <div class="big">${sc.toFixed(2)} / ${N}</div>
    <div>${(sc / N * 100).toFixed(1)}%</div>
    <p style="color:var(--mut)">${right} contained the correct answer · ${wrong} wrong · ${blank} unanswered · ${hedged} hedged${S.dur ? ' · time used ' + fmt(S.elapsed) : ''}</p>
    <div class="row"><button class="btn pri" id="again">New attempt</button></div></div>
    <div class="tabs" id="tabs">${['all', 'wrong', 'unanswered', 'flagged'].map(f => `<button class="btn ${f === filter ? 'on' : ''}" data-f="${f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}</div>
    <div id="review"></div>`;
  $('#again').onclick = home;
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; results(); } };
  $('#review').innerHTML = Q.map((q, i) => {
    const s = S.sel[i] || [], p = points(i);
    if (filter === 'wrong' && (s.length && p > 0)) return '';
    if (filter === 'wrong' && !s.length) return '';
    if (filter === 'unanswered' && s.length) return '';
    if (filter === 'flagged' && !S.flag[i]) return '';
    const o = q.o.map((t, k) => `<div class="opt ${k === q.a ? 'ok' : s.includes(k) ? 'bad' : ''}" style="cursor:default"><span class="l">${LET[k]}</span><span>${esc(t)}</span></div>`).join('');
    return `<div class="card" style="margin-bottom:12px"><div class="qnum">Q${q.n} · ${s.length ? 'you chose ' + s.map(k => LET[k]).join(', ') : 'unanswered'} · ${p.toFixed(2)} pt${S.flag[i] ? ' · ⚑' : ''}</div><p class="qtext" style="font-size:17px">${esc(q.q)}</p>${o}</div>`;
  }).join('') || '<div class="card center">Nothing to show for this filter.</div>';

}

$('#hsubmit').onclick = () => submit(false);
document.addEventListener('keydown', e => {
  if (!S || S.done || $('#hsubmit').hidden || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(S.cur + 1);
  else if (e.key === 'ArrowLeft') go(S.cur - 1);
  else if ('abcde'.includes(e.key.toLowerCase()) && e.key.length === 1) pick('abcde'.indexOf(e.key.toLowerCase()));
});
